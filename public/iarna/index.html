<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iarna</title>
<meta name="description" content="Простая браузерная игра: житель Молдовы пытается пережить зиму, балансируя между заработком и отоплением.">
<style>
  :root {
    --bg: #0e1726;
    --panel: #16223a;
    --panel-2: #1d2c49;
    --text: #e8eef8;
    --muted: #8fa3c4;
    --accent: #ffb547;
    --good: #5fd38d;
    --bad: #ff6b6b;
    --cold: #6cc4ff;
    --hot: #ff8a3d;
    --enamel: #eef1f4;
    --enamel-edge: #c9d0d8;
    --enamel-text: #2b3440;
    --lcd: #a9c9a4;
    --lcd-ink: #1d2b1c;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; color-scheme: dark; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .date { color: var(--muted); font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; margin-top: 14px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border-radius: var(--radius); padding: 14px; }
  .scene { position: relative; padding: 0; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.45);
    padding: 4px 10px; border-radius: 999px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .scene .badge.right { left: auto; right: 10px; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
  .stat .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .stat .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 50%; background: var(--good); transition: width .3s, background .3s; }
  .up { color: var(--bad); }

  /* ----- Котёл ----- */
  .boiler { margin-top: 14px; background: linear-gradient(180deg, var(--enamel), #dde2e8);
    border: 1px solid var(--enamel-edge); border-radius: 12px; padding: 12px; color: var(--enamel-text); }
  .boiler-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px;
    letter-spacing: 1.5px; text-transform: uppercase; color: #6b7684; }
  .boiler-top b { color: var(--enamel-text); letter-spacing: 2px; }
  .boiler-body { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; margin-top: 8px; }
  .lcd { background: var(--lcd); color: var(--lcd-ink); border-radius: 6px; padding: 8px 10px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; box-shadow: inset 0 2px 6px rgba(0,0,0,.25);
    min-height: 92px; display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
  .lcd .big { font-size: 30px; font-weight: 700; line-height: 1.05; display: flex; align-items: center; gap: 8px; }
  .lcd .row2 { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; flex-wrap: wrap; }
  .lcd .err { font-weight: 700; }
  .flame { width: 18px; height: 22px; opacity: .15; transition: opacity .3s; }
  .flame.on { opacity: 1; }
  .knob-wrap { display: grid; justify-items: center; gap: 6px; }
  .knob { width: 92px; height: 92px; border-radius: 50%; position: relative; cursor: grab; touch-action: none;
    background: radial-gradient(circle at 35% 30%, #fff, #cfd6de 60%, #aab3be);
    box-shadow: 0 3px 6px rgba(0,0,0,.3), inset 0 -2px 3px rgba(0,0,0,.15); border: 0; padding: 0; }
  .knob:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .knob .ptr { position: absolute; left: 50%; top: 8px; width: 4px; height: 22px; margin-left: -2px;
    background: #d9480f; border-radius: 2px; }
  .knob .dial { position: absolute; inset: 0; transition: transform .12s; }
  .scale { font-size: 10px; color: #6b7684; display: flex; justify-content: space-between; width: 110px; }
  .knob-btns { display: flex; gap: 6px; }
  .kbtn { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--enamel-edge); background: #fff;
    font: inherit; font-weight: 700; color: var(--enamel-text); cursor: pointer; }
  .boiler-bottom { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .sw { border: 1px solid var(--enamel-edge); background: #fff; color: var(--enamel-text); border-radius: 8px;
    padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .sw.on { background: #2f7d4f; border-color: #2f7d4f; color: #fff; }
  .sw.warn { background: #d9480f; border-color: #d9480f; color: #fff; }
  .forecast { font-size: 13px; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .forecast b { color: var(--text); }

  .controls { margin-top: 14px; display: grid; gap: 14px; }
  .group-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg button { background: var(--panel-2); color: var(--text); border: 2px solid transparent; border-radius: 10px;
    padding: 8px 4px; cursor: pointer; font: inherit; font-size: 13px; line-height: 1.2; }
  .seg button small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .seg button:hover { border-color: rgba(255,255,255,.15); }
  .seg button.on { border-color: var(--accent); background: #2a3a5c; }
  .seg button:disabled { opacity: .4; cursor: not-allowed; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { background: var(--accent); color: #1a1200; border: 0; border-radius: 10px; padding: 10px 16px;
    font: inherit; font-weight: 700; cursor: pointer; }
  .btn.ghost { background: var(--panel-2); color: var(--text); font-weight: 500; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .log { margin-top: 16px; max-height: 240px; overflow-y: auto; font-size: 14px; }
  .log p { margin: 0; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .log p .d { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .log p.good { color: var(--good); }
  .log p.bad { color: var(--bad); }

  .overlay { position: fixed; inset: 0; background: rgba(5,10,20,.82); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 10; overflow-y: auto; }
  .overlay.show { display: flex; }
  .modal { background: var(--panel); border-radius: var(--radius); max-width: 540px; width: 100%; padding: 22px; margin: auto; }
  .modal h2 { margin: 0 0 8px; }
  .modal ul { padding-left: 18px; color: var(--muted); }
  .modal ul b { color: var(--text); }

  .hint { color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .knob .dial, .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Iarna <span>❄</span> пережить зиму в Молдове</h1>
    <div class="date" id="date">1 декабря</div>
  </header>

  <div class="grid">
    <div>
      <div class="card scene">
        <canvas id="scene"></canvas>
        <div class="badge" id="outBadge">На улице: 0°C</div>
        <div class="badge right" id="speedBadge">▶ 1×</div>
      </div>

      <div class="card log" id="log"></div>
    </div>

    <div>
      <div class="card">
        <div class="stats">
          <div class="stat">
            <div class="label">Деньги</div>
            <div class="value" id="money">0 lei</div>
            <div class="bar"><i id="moneyBar"></i></div>
          </div>
          <div class="stat">
            <div class="label">Здоровье</div>
            <div class="value" id="health">100</div>
            <div class="bar"><i id="healthBar"></i></div>
          </div>
          <div class="stat">
            <div class="label">В доме</div>
            <div class="value" id="inside">0°C</div>
            <div class="bar"><i id="insideBar"></i></div>
          </div>
          <div class="stat">
            <div class="label">Газ, lei/м³</div>
            <div class="value" id="tariff">20,30</div>
            <div class="sub" id="tariffSub">с НДС</div>
          </div>
        </div>

        <div class="boiler" aria-label="Газовый котёл">
          <div class="boiler-top"><b>Котёл 24 кВт</b><span id="meter">Счётчик: 0 м³</span></div>
          <div class="boiler-body">
            <div class="lcd" id="lcd">
              <div class="row2"><span>ОТОПЛЕНИЕ</span><span id="lcdSet">УСТ 60°</span></div>
              <div class="big">
                <svg class="flame" id="flame" viewBox="0 0 18 22" aria-hidden="true"><path d="M9 1C10 6 15 8 15 14a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3-1-4 0-7 1-10z" fill="currentColor"/></svg>
                <span id="lcdFlow">--°</span>
              </div>
              <div class="row2"><span id="lcdPress">1.5 bar</span><span class="err" id="lcdErr"></span></div>
            </div>
            <div class="knob-wrap">
              <button class="knob" id="knob" role="slider" aria-label="Температура подачи отопления"
                aria-valuemin="30" aria-valuemax="80" aria-valuenow="60">
                <span class="dial" id="dial"><span class="ptr"></span></span>
              </button>
              <div class="scale"><span>30°</span><span>55°</span><span>80°</span></div>
              <div class="knob-btns">
                <button class="kbtn" id="minus" aria-label="Уменьшить на 1°">−</button>
                <button class="kbtn" id="plus" aria-label="Увеличить на 1°">+</button>
              </div>
            </div>
          </div>
          <div class="boiler-bottom">
            <button class="sw" id="powerBtn">⏻ Отопление</button>
            <button class="sw" id="refillBtn">Подпитать до 1,5 bar</button>
          </div>
        </div>
        <div class="forecast" id="forecast"></div>

        <div class="controls">
          <div>
            <div class="group-title">Чем заняться</div>
            <div class="seg" id="workSeg"></div>
          </div>
          <div class="row">
            <button class="btn" id="pauseBtn">Пауза</button>
            <button class="btn ghost" id="speedBtn">Скорость</button>
            <button class="btn ghost" id="helpBtn">Правила</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay show" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
(() => {
  // ---------- Настройки ----------
  const DAYS = 90;                  // 1 декабря 2026 — 28 февраля 2027
  const START_MONEY = 5500;
  const FOOD_PER_DAY = 110;
  const BILLS = 1300;               // свет, вода, интернет — раз в месяц
  const DEBT_LIMIT = -2000;         // дальше — газ отключают за неуплату

  // Тарифы для населения (lei/м³ с НДС 8%): с 1 сентября 2026 — 20,30;
  // 23 сентября Energocom запросил 24 305 lei/1000 м³ без НДС ≈ 26,25 с НДС.
  const TARIFF_START = 20.30;
  const TARIFF_REQUESTED = 26.25;

  // Теплофизика дома (~90 м², кирпич, старые окна)
  const UA = 0.24;         // теплопотери, кВт на 1°C разницы
  const C = 9;             // теплоёмкость дома, кВт·ч на 1°C
  const RAD_NOM = 7;       // мощность радиаторов при ΔT=50°C, кВт
  const Q_INTERNAL = 0.3;  // люди, плита, техника, кВт
  const BOILER_MAX = 24;   // кВт
  const KWH_PER_M3 = 9.3 * 0.92;  // теплотворность газа × КПД котла
  const STOVE_M3 = 0.6;    // плита и горячая вода, м³/день
  const FLOW_MIN = 30, FLOW_MAX = 80;

  // Время: один игровой час длится HOUR_MS реального времени на скорости 1×
  const HOUR_MS = 700;

  const WORK = [
    { name: 'Сидеть дома', sub: 'отдых, 0 lei', pay: 0, tired: -3 },
    { name: 'На работу', sub: '≈ 500 lei, пн–пт 8–18', pay: 500, tired: 0.5 },
    { name: 'Работа + такси', sub: '≈ 820 lei, до 22:00, без выходных', pay: 820, tired: 1.2 },
  ];
  const TAXI_WEEKEND = 350;
  const MONTHS = ['декабря', 'января', 'февраля', 'марта'];
  const WEEKDAYS = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
  const HOLIDAYS = { 24: 'Crăciun', 31: 'Anul Nou', 37: 'Crăciun (ст. стиль)', 38: 'Crăciun (ст. стиль)' };

  // ---------- Состояние ----------
  let S;
  function newGame() {
    S = {
      day: 0,
      hour: 6,
      money: START_MONEY,
      health: 100,
      inside: 16,
      flowSet: 55,
      flow: 20,
      power: true,
      pressure: 1.5,
      work: 1,
      tariff: TARIFF_START,
      anreDay: Math.round(rnd(4, 14)),
      dayOutside: 0,
      outside: 0,
      coldSnap: 0,
      boilerBroken: 0,          // часов до конца ремонта
      blackout: 0,              // часов без света
      gasCut: false,
      meter: 0,
      monthM3: 0, monthLei: 0,
      paused: true,
      speed: 1,
      over: false,
      log: [],
    };
    S.dayOutside = baseOutside(0);
    S.outside = hourOutside(S.dayOutside, S.hour);
    logMsg(`Зима пришла. На счету ${fmt(START_MONEY)} lei, газ стоит ${lei(TARIFF_START)} lei/м³. Продержитесь до 1 марта.`);
    logMsg('Energocom уже подал в ANRE заявку на повышение до 26,25 lei/м³. Решение ждут в декабре.', 'bad');
    logMsg('Совет: пока вы на работе, котёл можно убавить — дом остынет не сразу.');
    render();
  }

  // ---------- Утилиты ----------
  const $ = id => document.getElementById(id);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fmt = n => Math.round(n).toLocaleString('ru-RU');
  const lei = n => n.toFixed(2).replace('.', ',');
  const hh = h => String(h).padStart(2, '0') + ':00';

  function dateLabel(day) {
    const d = Math.min(day, DAYS);
    if (d < 31) return (d + 1) + ' ' + MONTHS[0];
    if (d < 62) return (d - 30) + ' ' + MONTHS[1];
    if (d < 90) return (d - 61) + ' ' + MONTHS[2];
    return '1 ' + MONTHS[3];
  }
  const weekday = d => (1 + d) % 7;                     // 1 декабря 2026 — вторник
  const isDayOff = d => weekday(d) >= 5 || d in HOLIDAYS;

  // где вы сейчас: дома или на работе
  function isAway(day = S.day, hour = S.hour) {
    if (S.work === 0 || S.health < 15) return false;
    const off = isDayOff(day);
    if (S.work === 1) return !off && hour >= 8 && hour < 18;
    return off ? hour >= 10 && hour < 18 : hour >= 8 && hour < 22;
  }

  function logMsg(text, kind = '') {
    S.log.unshift({ d: dateLabel(S.day) + ', ' + hh(S.hour), text, kind });
    if (S.log.length > 80) S.log.pop();
  }

  // Кишинёв: декабрь ≈ 0°C, январь ≈ −3°C, февраль ≈ −1°C
  function baseOutside(day) {
    const t = day / DAYS;
    return 1 - 5 * Math.sin(Math.PI * t) + rnd(-4, 4);
  }
  // ночью холоднее, днём теплее
  const hourOutside = (base, h) => base - 3 * Math.cos((h - 3) / 24 * 2 * Math.PI);

  // ---------- Физика котла и дома ----------
  function heating() { return S.power && !S.gasCut && S.boilerBroken === 0 && S.blackout === 0 && S.pressure >= 0.8; }

  // мощность радиаторов, кВт, при данной подаче и температуре в комнате
  function radiatorKW(flow, tin) {
    const dT = (flow - 5) - tin;          // средняя температура воды минус комната
    if (dT <= 0) return 0;
    return Math.min(BOILER_MAX, RAD_NOM * Math.pow(dT / 50, 1.3));
  }

  // один час: возвращает сожжённые м³ и новую температуру
  function heatHour(tin, tout, flowSet, on) {
    const q = on ? radiatorKW(flowSet, tin) : 0;
    return { m3: q / KWH_PER_M3, tin: tin + (q + Q_INTERNAL - UA * (tin - tout)) / C };
  }

  // прогноз на ближайшие 24 часа при текущей настройке
  function forecastDay() {
    let tin = S.inside, m3 = 0;
    for (let i = 0; i < 24; i++) {
      const r = heatHour(tin, hourOutside(S.dayOutside, (S.hour + i) % 24), S.flowSet, heating());
      tin = r.tin; m3 += r.m3;
    }
    return { tin, m3: m3 + (S.gasCut ? 0 : STOVE_M3) };
  }

  // ---------- Тарифы ----------
  function raiseTariff(newT, why) {
    const old = S.tariff;
    S.tariff = +newT.toFixed(2);
    const pct = Math.round((S.tariff / old - 1) * 100);
    logMsg(`${why} Газ дорожает: ${lei(old)} → ${lei(S.tariff)} lei/м³ (+${pct}%).`, 'bad');
  }

  // ---------- Случайные события ----------
  const EVENTS = [
    { w: 3, run() { const eur = [50, 100][Math.floor(rnd(0, 2))]; const sum = eur * 20;
        S.money += sum; logMsg(`Сын прислал ${eur}€ из Италии: +${fmt(sum)} lei`, 'good'); } },
    { w: 4, cond: () => S.coldSnap === 0, run() { S.coldSnap = Math.round(rnd(3, 7));
        logMsg(`Прогноз: с севера идёт мороз до −20°C на ${S.coldSnap} дн.`, 'bad'); } },
    { w: 3, cond: () => S.day > S.anreDay + 7, run() {
        raiseTariff(S.tariff * rnd(1.06, 1.14), 'Цены на европейских биржах снова выросли, Energocom просит пересмотра, ANRE соглашается.'); } },
    { w: 1, cond: () => S.day > 20, run() { S.money += 700;
        logMsg('Пришла компенсация за отопительный сезон: +700 lei', 'good'); } },
    { w: 2, cond: () => S.boilerBroken === 0, run() { S.money -= 1600; S.boilerBroken = 48;
        logMsg('Котёл выдал ошибку E01 — не зажигается. Мастер: −1600 lei, 2 дня без отопления.', 'bad'); } },
    { w: 3, cond: () => S.blackout === 0, run() { S.blackout = Math.round(rnd(6, 16));
        logMsg(`Отключили свет на ${S.blackout} ч — котёл без электричества не работает.`, 'bad'); } },
    { w: 3, run() { S.pressure -= rnd(0.4, 0.6);
        logMsg('Подтекает кран на радиаторе — давление в системе упало.', 'bad'); } },
    { w: 2, run() { S.inside += 2;
        logMsg('Сосед привёз мешок дров для печки: в доме теплее на 2°', 'good'); } },
    { w: 3, run() { const loss = Math.round(rnd(500, 1200)); S.money -= loss;
        const what = ['Заболел зуб, стоматолог', 'Лекарства из аптеки', 'Сломалась стиральная машина', 'Штраф за парковку'][Math.floor(rnd(0, 4))];
        logMsg(`${what}: −${fmt(loss)} lei`, 'bad'); } },
    { w: 2, run() { S.health = clamp(S.health + 6, 0, 100);
        logMsg('Бабушка сварила зямэ и дала вина из погреба: +6 здоровья', 'good'); } },
    { w: 1, cond: () => S.work > 0, run() { S.money += 600;
        logMsg('Начальник выдал премию: +600 lei', 'good'); } },
    { w: 2, cond: () => S.work > 0, run() { S.health = clamp(S.health - 8, 0, 100);
        logMsg('На работе все чихают — вы подхватили простуду: −8 здоровья', 'bad'); } },
  ];

  function pickEvent() {
    const pool = EVENTS.filter(e => !e.cond || e.cond());
    let r = Math.random() * pool.reduce((s, e) => s + e.w, 0);
    for (const e of pool) { if ((r -= e.w) < 0) return e; }
  }

  // ---------- Начало и конец суток ----------
  function startDay() {
    const d = S.day;
    if (d === 31 || d === 62) {
      logMsg(`Итог месяца по газу: ${fmt(S.monthM3)} м³ на ${fmt(S.monthLei)} lei.`);
      S.money -= BILLS; logMsg(`Счета за свет, воду и интернет: −${fmt(BILLS)} lei`, 'bad');
      S.monthM3 = 0; S.monthLei = 0;
    }
    if (d === 24) { S.money -= 800; S.health = clamp(S.health + 4, 0, 100); logMsg('Crăciun: стол для семьи −800 lei, +4 здоровья'); }
    if (d === 30) { S.money -= 700; logMsg('Revelion! Шампанское и оливье: −700 lei'); }
    if (d === 37) { S.health = clamp(S.health + 4, 0, 100); logMsg('Crăciun на старый стиль — колядующие принесли плацинды: +4 здоровья', 'good'); }

    if (d === S.anreDay) {
      const t = Math.random() < 0.7 ? TARIFF_REQUESTED : rnd(24.5, TARIFF_REQUESTED);
      raiseTariff(t, 'ANRE утвердило новый тариф по заявке Energocom (24 305 lei за 1000 м³ без НДС).');
    }

    if (Math.random() < 0.2) pickEvent().run();

    S.dayOutside = baseOutside(d) - (S.coldSnap > 0 ? rnd(9, 15) : 0);
    if (S.coldSnap > 0) S.coldSnap--;
  }

  function endDay() {
    const d = S.day, off = isDayOff(d);
    let pay = 0, tired = WORK[0].tired;
    if (S.health < 15) {
      if (S.work > 0) logMsg('Вы слишком больны, чтобы работать. День без заработка.', 'bad');
    } else if (S.work === 1 && !off) { pay = WORK[1].pay; tired = WORK[1].tired; }
    else if (S.work === 2) { pay = off ? TAXI_WEEKEND : WORK[2].pay; tired = WORK[2].tired; }
    if (pay && S.health < 35) pay *= 0.6;                 // работаете через силу
    if (pay) S.money += pay * rnd(0.9, 1.1);
    S.money -= FOOD_PER_DAY;
    S.health = clamp(S.health - tired, 0, 100);

    S.day++;
    if (S.health <= 0) return end(false, 'Вы слегли с воспалением лёгких. Зима победила.');
    if (S.day >= DAYS) {
      if (S.money < 0) return end(false, `Весна пришла, но вы должны ${fmt(-S.money)} lei. Придётся ехать на заработки в Италию…`);
      return end(true);
    }
  }

  // ---------- Шаг симуляции: один час ----------
  function tickHour() {
    if (S.over) return;
    if (S.hour === 0) startDay();

    S.outside = hourOutside(S.dayOutside, S.hour);
    S.pressure = Math.max(0, S.pressure - rnd(0.0005, 0.002));

    const on = heating();
    if (S.power && !on && S.pressure < 0.8 && S.hour === 8) logMsg('Котёл стоит с ошибкой E10: низкое давление. Подпитайте систему!', 'bad');
    const r = heatHour(S.inside, S.outside, S.flowSet, on);
    const m3 = r.m3 + (S.gasCut ? 0 : STOVE_M3 / 24);
    const cost = m3 * S.tariff;
    S.money -= cost;
    S.meter += m3; S.monthM3 += m3; S.monthLei += cost;
    S.inside = r.tin;
    if (S.boilerBroken > 0) S.boilerBroken--;
    if (S.blackout > 0) S.blackout--;

    // Здоровье: дома холод бьёт сильнее, чем на работе
    const exposure = isAway() ? 0.5 : (S.hour >= 23 || S.hour < 7 ? 0.6 : 1);   // ночью под одеялом
    let dh = 0;
    if (S.inside < 18) dh -= (18 - S.inside) * 0.8 * exposure;
    else if (S.inside <= 24) dh += isAway() ? 1 : 2.5;
    else dh -= (S.inside - 24) * 0.3;
    S.health = clamp(S.health + dh / 24, 0, 100);
    if (S.health <= 0) return end(false, 'Вы слегли с воспалением лёгких. Зима победила.');

    if (S.inside < 2 && S.boilerBroken === 0 && Math.random() < 0.08) {
      S.money -= 2500; S.boilerBroken = 72;
      logMsg('Трубы замёрзли и лопнули! Сантехник: −2500 lei, 3 дня без отопления.', 'bad');
    }

    if (!S.gasCut && S.money < DEBT_LIMIT) {
      S.gasCut = true;
      logMsg('Долг за газ слишком большой — газ отключили!', 'bad');
    } else if (S.gasCut && S.money > 300) {
      S.gasCut = false; S.money -= 300;
      logMsg('Долг погашен, газ подключили обратно (−300 lei за подключение).', 'good');
    }

    S.hour++;
    if (S.hour === 24) { S.hour = 0; endDay(); }
    if (!S.over) render();
  }

  // ---------- Игровой цикл ----------
  let acc = 0, last = performance.now();
  function loop(now) {
    const dt = Math.min(now - last, 500); last = now;
    if (!S.paused && !S.over) {
      acc += dt * S.speed;
      while (acc >= HOUR_MS && !S.over) { acc -= HOUR_MS; tickHour(); }
    }
    // вода в котле плавно догоняет уставку
    const target = heating() ? S.flowSet : Math.max(S.inside, 15);
    S.flow += (target - S.flow) * Math.min(1, dt / 1500);
    renderBoiler();
    draw(now);
    requestAnimationFrame(loop);
  }

  // ---------- Конец ----------
  function end(win, reason) {
    S.over = true; S.paused = true;
    render();
    const score = Math.max(0, Math.round(S.money / 10 + S.health * 10));
    const gasLine = `За зиму сожгли <b>${fmt(S.meter)} м³</b> газа, последний тариф — <b>${lei(S.tariff)} lei/м³</b>.`;
    showModal(win
      ? `<h2>🌷 Вы пережили зиму!</h2>
         <p>Наступил Mărțișor. Осталось <b>${fmt(S.money)} lei</b>, здоровье <b>${Math.round(S.health)}</b>.</p>
         <p>${gasLine}</p>
         <p>Очки: <b>${score}</b></p>
         <button class="btn" id="again">Ещё зиму</button>`
      : `<h2>🥶 Игра окончена</h2>
         <p>${reason}</p>
         <p>${gasLine}</p>
         <p class="hint">Дожили до ${dateLabel(S.day)}.</p>
         <button class="btn" id="again">Попробовать снова</button>`);
    $('again').onclick = () => { hideModal(); const sp = S.speed; newGame(); S.speed = sp; S.paused = false; render(); };
  }

  // ---------- Ручка котла ----------
  const ANG_MIN = -135, ANG_MAX = 135;
  const toAngle = t => ANG_MIN + (t - FLOW_MIN) / (FLOW_MAX - FLOW_MIN) * (ANG_MAX - ANG_MIN);
  function setFlow(t) {
    if (S.over) return;
    S.flowSet = clamp(Math.round(t), FLOW_MIN, FLOW_MAX);
    render();
  }
  function bindKnob() {
    const knob = $('knob');
    let drag = false;
    const fromPointer = e => {
      const r = knob.getBoundingClientRect();
      const a = Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) * 180 / Math.PI;
      setFlow(FLOW_MIN + (clamp(a, ANG_MIN, ANG_MAX) - ANG_MIN) / (ANG_MAX - ANG_MIN) * (FLOW_MAX - FLOW_MIN));
    };
    knob.addEventListener('pointerdown', e => { drag = true; knob.setPointerCapture(e.pointerId); fromPointer(e); });
    knob.addEventListener('pointermove', e => { if (drag) fromPointer(e); });
    knob.addEventListener('pointerup', () => { drag = false; });
    knob.addEventListener('wheel', e => { e.preventDefault(); setFlow(S.flowSet + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });
    knob.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); setFlow(S.flowSet + 1); }
      if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); setFlow(S.flowSet - 1); }
    });
    $('minus').onclick = () => setFlow(S.flowSet - 1);
    $('plus').onclick = () => setFlow(S.flowSet + 1);
    $('powerBtn').onclick = () => { if (!S.over) { S.power = !S.power; render(); } };
    $('refillBtn').onclick = () => {
      if (S.over) return;
      if (S.pressure >= 1.45) return;
      S.pressure = 1.5; logMsg('Открыли кран подпитки: давление снова 1,5 bar.', 'good'); render();
    };
  }

  // ---------- UI ----------
  function buildControls() {
    $('workSeg').innerHTML = WORK.map((w, i) =>
      `<button data-i="${i}">${w.name}<small>${w.sub}</small></button>`).join('');
    $('workSeg').onclick = e => { const t = e.target.closest('button'); if (t) { S.work = +t.dataset.i; render(); } };
    $('pauseBtn').onclick = () => { if (!S.over) { S.paused = !S.paused; render(); } };
    $('speedBtn').onclick = () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; render(); };
    $('helpBtn').onclick = () => { S.paused = true; render(); showRules(); };
    bindKnob();
    document.addEventListener('keydown', e => {
      if ($('overlay').classList.contains('show')) return;
      if (e.code === 'Space' && !S.over) { e.preventDefault(); S.paused = !S.paused; render(); }
      if (document.activeElement === $('knob')) return;
      if (e.key === '+' || e.key === '=') setFlow(S.flowSet + 1);
      if (e.key === '-') setFlow(S.flowSet - 1);
    });
  }

  function setBar(id, pct, color) {
    const el = $(id); el.style.width = clamp(pct, 0, 100) + '%'; el.style.background = color;
  }
  function tempColor(t) { return t < 16 ? 'var(--cold)' : t > 24 ? 'var(--hot)' : 'var(--good)'; }

  function boilerError() {
    if (!S.power) return 'ВЫКЛ';
    if (S.gasCut) return 'НЕТ ГАЗА';
    if (S.blackout) return 'НЕТ СВЕТА';
    if (S.boilerBroken) return 'E01';
    if (S.pressure < 0.8) return 'E10';
    return '';
  }

  function renderBoiler() {
    const on = heating();
    const burning = on && radiatorKW(S.flowSet, S.inside) > 0.05;
    $('lcdFlow').textContent = Math.round(S.flow) + '°';
    $('flame').classList.toggle('on', burning && !S.paused);
  }

  function render() {
    const wd = WEEKDAYS[weekday(Math.min(S.day, DAYS - 1))];
    const hol = HOLIDAYS[S.day] ? ' · ' + HOLIDAYS[S.day] : '';
    const where = S.over ? '' : isAway() ? ' · вы на работе' : ' · вы дома';
    $('date').textContent = `${dateLabel(S.day)}, ${wd}${hol}, ${hh(S.hour)}${where} · день ${Math.min(S.day + 1, DAYS)} из ${DAYS}`;
    $('money').textContent = fmt(S.money) + ' lei';
    $('money').style.color = S.money < 0 ? 'var(--bad)' : '';
    setBar('moneyBar', S.money / 150, S.money < 1500 ? 'var(--bad)' : 'var(--accent)');

    $('health').textContent = Math.round(S.health);
    setBar('healthBar', S.health, S.health < 35 ? 'var(--bad)' : 'var(--good)');

    $('inside').textContent = S.inside.toFixed(1) + '°C';
    $('inside').style.color = tempColor(S.inside);
    setBar('insideBar', (S.inside + 5) / 35 * 100, tempColor(S.inside));

    $('tariff').textContent = lei(S.tariff);
    const pct = Math.round((S.tariff / TARIFF_START - 1) * 100);
    $('tariffSub').innerHTML = pct > 0 ? `с НДС · <span class="up">▲ +${pct}% за зиму</span>` : 'с НДС · с 1 сентября 2026';

    // Котёл
    const err = boilerError();
    $('lcdSet').textContent = `УСТ ${S.flowSet}°`;
    $('lcdPress').textContent = S.pressure.toFixed(1) + ' bar';
    $('lcdErr').textContent = err;
    $('dial').style.transform = `rotate(${toAngle(S.flowSet)}deg)`;
    $('knob').setAttribute('aria-valuenow', S.flowSet);
    $('knob').setAttribute('aria-valuetext', S.flowSet + ' градусов');
    $('powerBtn').classList.toggle('on', S.power);
    $('powerBtn').textContent = S.power ? '⏻ Отопление вкл' : '⏻ Отопление выкл';
    $('refillBtn').classList.toggle('warn', S.pressure < 1);
    $('meter').textContent = `Счётчик: ${fmt(S.meter)} м³`;

    // Прогноз на сутки при текущей настройке
    const f = forecastDay();
    $('forecast').innerHTML = heating()
      ? `Если оставить ${S.flowSet}° на сутки: в доме будет <b>≈${f.tin.toFixed(0)}°C</b>, газ <b>≈${f.m3.toFixed(1)} м³</b> = <b>${fmt(f.m3 * S.tariff)} lei</b>.`
      : `Отопление не работает. Через сутки в доме будет <b>≈${f.tin.toFixed(0)}°C</b>.`;

    [...$('workSeg').children].forEach((el, i) => { el.classList.toggle('on', i === S.work); el.disabled = S.over; });

    $('outBadge').textContent = 'На улице: ' + S.outside.toFixed(0) + '°C' + (S.coldSnap > 0 ? ' · мороз' : '');
    $('speedBadge').textContent = (S.paused ? '⏸ пауза' : '▶ ' + S.speed + '×');
    $('pauseBtn').textContent = S.paused ? 'Играть' : 'Пауза';

    $('log').innerHTML = S.log.map(l => `<p class="${l.kind}"><span class="d">${l.d}</span>${l.text}</p>`).join('');
  }

  function showModal(html) { $('modal').innerHTML = html; $('overlay').classList.add('show'); }
  function hideModal() { $('overlay').classList.remove('show'); }

  function showRules(first) {
    showModal(`
      <h2>Iarna ❄ как пережить зиму</h2>
      <p>Вы живёте в кирпичном доме под Кишинёвом. Впереди 90 дней зимы, продержитесь до 1 марта.</p>
      <ul>
        <li><b>Котёл</b>: ручка задаёт температуру воды в радиаторах, от 30 до 80°C. Горячее вода — теплее в доме, но тем больше газа сгорает, особенно в мороз.</li>
        <li><b>Газ</b> стоит ${lei(TARIFF_START)} lei/м³. Energocom уже просит 26,25, и цены будут расти дальше.</li>
        <li>Давление в системе падает. Ниже 0,8 bar котёл встаёт с ошибкой E10, тогда нажмите «Подпитать».</li>
        <li><b>Время идёт по часам.</b> Работа с 8 до 18 в будни, такси — ещё до 22:00 и по выходным. Пока вас нет, котёл можно убавить: дом остывает не сразу, а газ стоит денег.</li>
        <li>При 18–24°C в доме здоровье восстанавливается, ниже 18°C падает — особенно когда вы дома. Больной человек зарабатывает меньше, а совсем больной не работает.</li>
        <li>Зарплаты на полное отопление не хватит. Экономьте, берите подработку, но не загоните себя.</li>
        <li>Долг больше <b>${fmt(-DEBT_LIMIT)} lei</b> — газ отключат. Ниже 2°C в доме лопнут трубы.</li>
      </ul>
      <p class="hint">Пробел — пауза. Ручку можно крутить мышью, колёсиком, стрелками или клавишами +/−.</p>
      <button class="btn" id="startBtn">${first ? 'Начать зиму' : 'Продолжить'}</button>`);
    $('startBtn').onclick = () => { hideModal(); S.paused = false; render(); };
  }

  // ---------- Сцена ----------
  const cv = $('scene'), ctx = cv.getContext('2d');
  let W = 0, H = 0;
  const flakes = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), r: rnd(1, 2.6), v: rnd(0.02, 0.06) }));

  function resize() {
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  function draw(now) {
    if (!W) resize();
    const cold = clamp((-S.outside) / 20, 0, 1);
    const light = clamp(Math.sin((S.hour - 7) / 10 * Math.PI), 0, 1);   // светло с 7 до 17
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `rgb(${Math.round(14 + light * 110 - cold * 10)}, ${Math.round(24 + light * 130 - cold * 10)}, ${Math.round(50 + light * 150)})`);
    g.addColorStop(1, `rgb(${Math.round(36 + light * 150)}, ${Math.round(50 + light * 150)}, ${Math.round(84 + light * 140)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#dfe8f5';
    ctx.fillRect(0, H * 0.78, W, H * 0.22);

    // дом
    const hx = W * 0.3, hy = H * 0.42, hw = W * 0.4, hh = H * 0.36;
    ctx.fillStyle = '#e9d8b4'; ctx.fillRect(hx, hy, hw, hh);
    ctx.fillStyle = '#8a4b2d';
    ctx.beginPath(); ctx.moveTo(hx - 14, hy); ctx.lineTo(hx + hw / 2, hy - H * 0.2); ctx.lineTo(hx + hw + 14, hy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f4f8ff';
    ctx.beginPath(); ctx.moveTo(hx - 14, hy); ctx.lineTo(hx + hw / 2, hy - H * 0.2); ctx.lineTo(hx + hw + 14, hy);
    ctx.lineTo(hx + hw + 14, hy + 5); ctx.lineTo(hx + hw / 2, hy - H * 0.2 + 8); ctx.lineTo(hx - 14, hy + 5); ctx.closePath(); ctx.fill();

    // окна — цвет зависит от температуры дома
    const warm = clamp((S.inside - 5) / 20, 0, 1);
    const winCol = `rgb(${Math.round(110 + 145 * warm)}, ${Math.round(160 + 40 * warm)}, ${Math.round(220 - 140 * warm)})`;
    const ww = hw * 0.22, wh = hh * 0.35;
    [[hx + hw * 0.12, hy + hh * 0.2], [hx + hw * 0.66, hy + hh * 0.2]].forEach(([x, y]) => {
      ctx.fillStyle = winCol; ctx.shadowColor = winCol; ctx.shadowBlur = 20 * warm;
      ctx.fillRect(x, y, ww, wh); ctx.shadowBlur = 0;
      ctx.strokeStyle = '#5b3a24'; ctx.lineWidth = 3; ctx.strokeRect(x, y, ww, wh);
      ctx.beginPath(); ctx.moveTo(x + ww / 2, y); ctx.lineTo(x + ww / 2, y + wh); ctx.moveTo(x, y + wh / 2); ctx.lineTo(x + ww, y + wh / 2); ctx.stroke();
      if (S.inside < 12) { ctx.fillStyle = `rgba(230,245,255,${clamp((12 - S.inside) / 12, 0, .7)})`; ctx.fillRect(x, y, ww, wh); }
    });
    ctx.fillStyle = '#5b3a24'; ctx.fillRect(hx + hw * 0.42, hy + hh * 0.45, hw * 0.16, hh * 0.55);

    // коаксиальный дымоход и пар — чем горячее подача, тем гуще
    const cx = hx + hw + 2, cy = hy + hh * 0.15;
    ctx.fillStyle = '#9aa4b1'; ctx.fillRect(cx, cy, 16, 6);
    const smoke = heating() && !S.paused ? Math.round((S.flowSet - 25) / 6) : 0;
    for (let i = 0; i < smoke; i++) {
      const t = ((now / 2500) + i / smoke) % 1;
      ctx.fillStyle = `rgba(220,225,235,${0.45 * (1 - t)})`;
      ctx.beginPath();
      ctx.arc(cx + 18 + t * 30 + Math.sin(t * 6 + i) * 6, cy - t * H * 0.3, 3 + t * 12, 0, Math.PI * 2);
      ctx.fill();
    }

    // человечек дома, если не на работе
    if (!isAway()) {
      const px = hx - 26, py = H * 0.78;
      ctx.fillStyle = '#2d2d2d';
      ctx.beginPath(); ctx.arc(px, py - 34, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b23a3a'; ctx.fillRect(px - 8, py - 27, 16, 20);
      ctx.fillStyle = '#2d2d2d'; ctx.fillRect(px - 7, py - 7, 5, 7); ctx.fillRect(px + 2, py - 7, 5, 7);
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(px - 7, py - 46, 14, 7);
    }

    const speed = S.paused ? 0.2 : 1;
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (const f of flakes) {
      f.y += f.v * 0.016 * speed * (1 + cold); f.x += Math.sin(now / 1000 + f.r) * 0.0004;
      if (f.y > 1) { f.y = 0; f.x = Math.random(); }
      ctx.beginPath(); ctx.arc(f.x * W, f.y * H, f.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---------- Старт ----------
  buildControls();
  newGame();
  if (location.hash === '#test') window.__iarna = { get S() { return S; }, tickHour, newGame };
  showRules(true);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
